<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enverus One Page Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Sidebar tokens from enverus-one/tokens.css (light and dark). */
  :root, .light-theme {
    color-scheme: light;
    --background: oklch(0.95 0 0);
    --foreground: oklch(0.145 0 0);
    --muted: oklch(0.94 0 0);
    --muted-foreground: oklch(0.4 0 0);
    --primary: oklch(0.544 0.149 138.62);
    --primary-foreground: oklch(1 0 0);
    --info: oklch(0.481 0.094 239.6);
    --ai: oklch(0.513 0.227 314.3);
    --sidebar: oklch(0.98 0 0);
    --sidebar-foreground: oklch(0.145 0 0);
    --sidebar-accent: oklch(0.97 0 0);
    --sidebar-accent-foreground: oklch(0.205 0 0);
    --sidebar-border: oklch(0% 0 0 / 0.18);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --border: oklch(0% 0 0 / 0.2);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --secondary: oklch(0.967 0.001 286.375);
    --secondary-foreground: oklch(0.21 0.006 285.885);
    --input: oklch(88% 0 0);
    --sidebar-ring: oklch(0.708 0 0);
    --logo-green-light: #A0EF6E;
    --logo-green: #56BC2F;
  }
  .dark-theme {
    color-scheme: dark;
    --background: oklch(20.5% 0 0);
    --foreground: oklch(0.985 0 0);
    --muted: oklch(0.325 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --primary: oklch(0.544 0.149 138.62);
    --primary-foreground: oklch(1 0 0);
    --info: oklch(0.72 0.1 240.6);
    --ai: oklch(0.643 0.244 313.7);
    --sidebar: oklch(0.24 0 0);
    --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.269 0 0);
    --sidebar-accent-foreground: oklch(0.985 0 0);
    --sidebar-border: oklch(1 0 0 / 10%);
    --popover: oklch(0.26 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --border: oklch(100% 0 0 / 0.1);
    --accent: oklch(0.325 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --secondary: oklch(0.33 0.006 286.033);
    --secondary-foreground: oklch(0.85 0 0);
    --input: oklch(100% 0 0 / .15);
    --sidebar-ring: oklch(0.556 0 0);
    --logo-green-light: #A0EF6E;
    --logo-green: #56BC2F;
  }

  html { font-size: 14px; height: 100%; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Roboto Flex", system-ui, sans-serif;
    background: var(--background);
    color: var(--foreground);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 24px;
    align-items: flex-start;
    gap: 40px;
    padding: 32px;
  }
  .page-title { flex-shrink: 0; margin: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .page-title h1 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 0; color: var(--foreground); }
  .page-title p { font-size: 14px; line-height: 20px; margin: 4px 0 0; color: var(--muted-foreground); }
  .theme-switch { margin: 0; width: 200px; flex-shrink: 0; }
  .options { display: flex; gap: 48px; flex: 1 1 0; min-height: 0; overflow-x: auto; }
  .option { display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }
  .option-title { flex-shrink: 0; font-size: 14px; font-weight: 500; line-height: 20px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--primary); color: var(--foreground); }
  .cols { display: flex; flex-wrap: nowrap; flex: 1 1 0; min-height: 0; gap: 32px; align-items: stretch; overflow-x: auto; }
  .col { display: grid; grid-template-rows: minmax(0, 1fr); height: 100%; min-height: 0; }
  .col > div { min-height: 0; height: 100%; }
  .col.light { color-scheme: light; }
  .col.dark { color-scheme: dark; }

  /* Sidebar container: 264px expanded, sidebar token background and border. */
  .sb {
    width: 264px;
    height: 100%;
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    border-radius: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 6px 8px;
    color: var(--sidebar-foreground);
    overflow: hidden;
  }

  .sb-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px 7px;
    border-bottom: 1px solid var(--sidebar-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand-full { height: 17px; width: auto; flex-shrink: 0; }
  .brand-mark { display: none; width: 18px; height: 18px; flex-shrink: 0; }
  .sb.collapsed .brand-full { display: none !important; }
  .sb.collapsed .brand-mark { display: block; }
  .icon-btn {
    width: 28px;
    height: 28px;
    display: inline-grid;
    place-items: center;
    border: 0;
    background: transparent;
    border-radius: 8px;
    color: var(--muted-foreground);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .icon-btn svg { width: 16px; height: 16px; }
  .head-actions { display: flex; gap: 2px; }

  /* Scrollbar colors come from the sidebar border token, so they follow the light and dark themes. */
  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--sidebar-border) transparent; }

  .group { padding: 0 2px; margin-bottom: 14px; }
  .group-label {
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    color: var(--muted-foreground);
    padding: 6px 8px 4px;
  }

  .item {
    width: 100%;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--sidebar-foreground);
    font: inherit;
    font-size: 14px;
    line-height: 1;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .item:hover { background: var(--sidebar-accent); }
  .item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .item .label { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .item.active {
    background: var(--sidebar-accent);
    color: var(--sidebar-accent-foreground);
    font-weight: 500;
  }
  .item.muted { color: var(--muted-foreground); }
  .item.muted:hover { color: var(--sidebar-foreground); }
  .item .meta { font-size: 12px; color: var(--muted-foreground); }

  .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--muted-foreground);
    margin: 0 6px 0 4px;
    flex-shrink: 0;
  }

  .tile {
    width: 18px; height: 18px;
    border-radius: 5px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 500;
    color: var(--primary-foreground);
    flex-shrink: 0;
  }
  .tile.a { background: var(--primary); }
  .tile.p { background: var(--info); }
  .tile.d { background: var(--ai); }

  .sb-foot {
    margin-top: auto;
    padding: 10px 6px 0;
  }
  .user {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--sidebar-foreground);
    font: inherit;
    font-size: 14px;
    line-height: 1;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .user:hover { background: var(--sidebar-accent); }
  .avatar {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid; place-items: center;
    font-size: 9px; font-weight: 500;
    flex-shrink: 0;
  }
  .user .label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  [hidden] { display: none !important; }

  /* Menu and Recents toggle, below the logo. Segmented control on the sidebar tokens. */
  .mode-toggle { display: flex; gap: 2px; margin: 0 2px 10px; padding: 2px 8px; border: 1px solid var(--sidebar-border); border-radius: 8px; }
  .mode-btn { flex: 1; height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; line-height: 1; cursor: pointer; }
  .mode-btn:hover { color: var(--sidebar-foreground); }
  .mode-btn[aria-pressed="true"] { background: var(--muted); color: var(--foreground); border: 1px solid var(--sidebar-border); font-weight: 500; }
  .sb.collapsed .mode-toggle { display: none; }

  /* Collapse toggle: panel-left-close when expanded, panel-left-open when collapsed. */
  .chev-open { display: none; }
  .sb.collapsed .chev-open { display: inline; }
  .sb.collapsed .chev-close { display: none; }

  /* New Chat in the Menu and Recents sidebar: a bordered, centered button. */
  .item.new-chat { justify-content: center; text-align: center; height: 32px; margin: 0; border: 1px solid var(--primary); border-radius: 8px; background: transparent; color: var(--foreground); font-weight: 500; }
  .item.new-chat:hover { background: var(--sidebar-accent); color: var(--foreground); }
  .item.new-chat .label { flex: 0 1 auto; }
  .new-chat-row { padding: 8px; }
  .sb.collapsed .new-chat-row { padding: 0; }

  /* Ellipsis on Pinned and Recent Chats items: visible on hover, opens an actions menu. */
  .row-item { position: relative; }
  .row-item .item { padding-right: 32px; }
  .item-more { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; opacity: 0; }
  .row-item:hover .item-more,
  .row-item:focus-within .item-more,
  .row-item.menu-open .item-more { opacity: 1; }
  .sb.collapsed .item-more { display: none; }
  .action-menu { position: absolute; right: 6px; top: 100%; z-index: 10; min-width: 160px; padding: 4px; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 8px; }
  .action-item { display: block; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .action-item:hover { background: var(--accent); color: var(--accent-foreground); }
  .action-item.destructive { color: var(--destructive); }

  /* Search field that opens under the logo from the search icon button. */
  .search-row { position: relative; margin: 0; padding: 8px 12px; }
  .search-row svg { position: absolute; left: 22px; top: 22px; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted-foreground); pointer-events: none; }
  .search-input { width: 100%; height: 28px; padding: 0 10px 0 36px; border: 1px solid var(--input); border-radius: 8px; background: transparent; color: var(--sidebar-foreground); font: inherit; font-size: 14px; }
  .search-input::placeholder { color: var(--muted-foreground); }
  .search-input:focus-visible { outline: 2px solid var(--sidebar-ring); outline-offset: 1px; }
  .sb.collapsed .search-row { display: none; }
  .sb.collapsed .search.rail-search { display: inline-grid; }

  /* Pinned and Recents headings toggle their lists open and closed. */
  .group-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; line-height: 16px; font-weight: 500; padding: 6px 8px 4px; cursor: pointer; text-align: left; }
  .group-toggle:hover { color: var(--sidebar-foreground); }
  .group-toggle svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform 150ms ease; }
  .sb.collapsed .group-toggle { display: none; }

  /* Collapsed icon rail: 48px, icons only, 32px item squares (sidebar.md, Anatomy — Collapsed). */
  /* More panel: grid-row 0fr to 1fr animates the height; visibility keeps closed items out of the tab order. */
  .more-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms ease; }
  .more-wrap.open { grid-template-rows: 1fr; }
  .more-panel { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 220ms ease; }
  .more-wrap.open .more-panel { visibility: visible; }
  @media (prefers-reduced-motion: reduce) {
    .more-wrap, .more-panel { transition: none; }
  }

  .sb.collapsed { width: 42px; padding: 12px 0 8px; }
  .sb.collapsed .sb-head { flex-direction: column; gap: 8px; padding: 4px 0 14px; }
  .sb.collapsed .brand-text,
  .sb.collapsed .notif,
  .sb.collapsed .search,
  .sb.collapsed .group-label,
  .sb.collapsed .item .label { display: none; }
  .sb.collapsed .head-actions { flex-direction: column-reverse; }
  .sb.collapsed .item { width: 32px; height: 32px; padding: 0; justify-content: center; margin: 0 auto; }
  .sb.collapsed .group { padding: 0; }
  .sb.collapsed .user { width: 32px; padding: 0; justify-content: center; margin: 0 auto; }
  .sb.collapsed .user .label { display: none; }
  .sb.collapsed .sb-foot { padding: 10px 0 0; }


  /* Full page layout: navbar on top, then the sidebar and the content area. */
  body { display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0; height: 100%; overflow: hidden; background: var(--background); }
  .navbar { position: sticky; top: 0; z-index: 40; flex-shrink: 0; height: 48px; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; background: var(--sidebar); color: var(--sidebar-foreground); border-bottom: 0; }
  .navbar-right { display: flex; height: 100%; align-items: center; gap: 16px; }
  .nav-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: var(--secondary); color: var(--secondary-foreground); cursor: pointer; }
  .nav-btn svg { width: 16px; height: 16px; }
  .avatar-btn { width: 32px; height: 32px; border: 0; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 12px; font-weight: 500; display: grid; place-items: center; cursor: pointer; }
  .app-body { flex: 1 1 0; min-height: 0; display: flex; }
  #app-sidebar { flex-shrink: 0; height: 100%; }
  .app-main { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* Tailwind-style utilities used by the page frame. The gutter and spacing follow the page layout (24px). */
  #page-frame { display: flex; flex-direction: column; min-height: 0; }
  .flex-1 { flex: 1 1 0%; }
  .max-w-6xl { max-width: 72rem; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .px-page-gutter { padding-left: 24px; padding-right: 24px; }
  .py-6 { padding-top: 24px; padding-bottom: 24px; }
  .w-full { width: 100%; }
  .relative { position: relative; }
  .z-10 { z-index: 10; }
  #page-header { flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  #page-titles { flex-shrink: 0; padding: 16px 24px; display: flex; align-items: flex-start; justify-content: space-between; }
  #page-title h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; color: var(--foreground); }
  #page-subtitle { margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); }
  #page-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .page-content { flex: 1 1 0; min-height: 0; overflow: auto; padding: 0 24px 24px; }
  .content-placeholder { height: 100%; min-height: 240px; border: 1px dashed var(--border); border-radius: 10px; display: grid; place-items: center; color: var(--muted-foreground); font-size: 14px; }
</style>
</head>
<body>
<div class="app-body">
  <div id="app-sidebar"></div>
  <main class="app-main" id="main-content">
<div class="navbar">
  <div class="navbar-right">
    <button class="nav-btn" id="theme-toggle" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <button class="avatar-btn" aria-label="Account menu">JS</button>
  </div>
</div>
    <div id="page-frame" class="flex-1 max-w-6xl mx-auto px-page-gutter py-6 w-full relative z-10">
    <div id="page-header">
      <div id="page-titles">
        <div>
          <div id="page-title"><h1>Flows</h1></div>
          <p id="page-subtitle">Run customizable flows to streamline your operations.</p>
        </div>
      </div>
    </div>
    <div id="page-body">
      <div class="page-content">
        <div class="content-placeholder">Page content</div>
      </div>
    </div>
    </div>
  </main>
</div>

<template id="sidebar-tpl">
<aside class="sb" aria-label="Primary">
  <div class="sb-head">

      <button class="item muted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg><span class="label">Bakken Offset Well Analysis</span></button>
      <button class="item muted">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="label">View All</span>
      </button>
    </div>

  </nav>

</aside>
</template>
<script>
  // Render the same sidebar markup once per theme. Dark uses the .dark-theme token block.
  const tpl = document.getElementById('sidebar-tpl');
  // Close every open actions menu, on an outside click or when a menu item is picked.
  const closeMenus = () => {
    document.querySelectorAll('.action-menu').forEach(menu => { menu.hidden = true; });
    document.querySelectorAll('.row-item.menu-open').forEach(row => {
      row.classList.remove('menu-open');
      row.querySelector('.item-more').setAttribute('aria-expanded', 'false');
    });
  };
  document.addEventListener('click', closeMenus);
  // Page theme switcher: .dark-theme on the root restyles the page. The light and dark sidebar columns keep their own theme classes.
  document.querySelectorAll('.theme-switch .mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark-theme', btn.dataset.theme === 'dark');
      document.querySelectorAll('.theme-switch .mode-btn').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });
  [['App sidebar', '', false, 'app-sidebar']].forEach(([label, cls, withToggle, host]) => {
    const col = document.createElement('div');
    col.className = 'col';
    // The dark Option 1 sidebar is hidden; the page opens in the light theme.
    col.hidden = label === 'Dark theme';
    const wrap = document.createElement('div');
    if (cls) wrap.className = cls;
    wrap.appendChild(tpl.content.cloneNode(true));
    col.appendChild(wrap);
    document.getElementById(host).appendChild(col);
    // More toggles the hidden items in the first section. The panel animates open and closed.
    const more = col.querySelector('.more-btn');
    const moreWrap = col.querySelector('.more-wrap');
    more.addEventListener('click', () => {
      const open = !moreWrap.classList.contains('open');
      moreWrap.classList.toggle('open', open);
      more.setAttribute('aria-expanded', String(open));
      more.querySelector('.label').textContent = open ? 'Less' : 'More';
    });
    // Every item shows its label as a tooltip on hover, expanded or collapsed.
    col.querySelectorAll('.item').forEach(item => {
      const text = item.querySelector('.label');
      if (text) item.title = text.textContent;
    });
    // Collapse to the 48px rail.
    const aside = col.querySelector('.sb');
    const toggle = col.querySelector('.collapse-btn');
    toggle.addEventListener('click', () => {
      const collapsed = aside.classList.toggle('collapsed');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      col.querySelectorAll('.item').forEach(item => {
        const text = item.querySelector('.label');
        if (text) item.setAttribute('aria-label', text.textContent);
      });
    });
    // Search: the icon button opens a field under the logo, above New Chat.
    const searchRow = document.createElement('div');
    searchRow.className = 'search-row';
    searchRow.hidden = true;
    searchRow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" class="search-input" placeholder="Search" aria-label="Search">';
    col.querySelector('.sb-head').after(searchRow);
    const searchBtn = col.querySelector('.icon-btn.search');
    searchBtn.setAttribute('aria-expanded', 'false');
    searchBtn.addEventListener('click', () => {
      // From the collapsed rail, expand the sidebar so the search field has room.
      if (aside.classList.contains('collapsed')) toggle.click();
      const open = searchRow.hidden;
      searchRow.hidden = !open;
      searchBtn.setAttribute('aria-expanded', String(open));
      if (open) searchRow.querySelector('input').focus();
    });
    // New Chat is a bordered, centered button in every column, wrapped in the logo header's padding.
    const newChat = col.querySelector('.menu-view .item');
    newChat.classList.add('new-chat');
    const newChatRow = document.createElement('div');
    newChatRow.className = 'new-chat-row';
    newChat.before(newChatRow);
    newChatRow.appendChild(newChat);
    if (withToggle) {
      // Menu and Recents: the Recent Apps, Recent Chats and Spaces sections are replaced by the modes.
      col.querySelectorAll('.sb-scroll > .group:not(.menu-view):not(.recents-view)').forEach(group => group.remove());
      // The search icon stays visible on the collapsed rail, above New Chat.
      col.querySelector('.icon-btn.search').classList.add('rail-search');
      const modeToggle = col.querySelector('.mode-toggle');
      const menuView = col.querySelector('.menu-view');
      const recentsView = col.querySelector('.recents-view');
      // In this column the New Chat row moves above the toggle, under the logo header.
      modeToggle.before(col.querySelector('.new-chat-row'));
      const setMode = mode => {
        menuView.hidden = mode !== 'menu';
        recentsView.hidden = mode !== 'recents';
        modeToggle.querySelectorAll('.mode-btn').forEach(btn => {
          btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode));
        });
      };
      modeToggle.addEventListener('click', e => {
        const btn = e.target.closest('.mode-btn');
        if (btn) setMode(btn.dataset.mode);
      });
      // The menu always shows the full list, so this column has no More/Less toggle.
      more.remove();
      moreWrap.classList.add('open');
      modeToggle.hidden = false;
      setMode('menu');
    }
    // Pinned and Recent Chats items get an ellipsis that opens an actions menu.
    col.querySelectorAll('.sb-scroll > .group').forEach(group => {
      const heading = group.querySelector('.group-label');
      if (!heading || !['Pinned', 'Recents'].includes(heading.textContent)) return;
      const pinned = heading.textContent === 'Pinned';
      group.querySelectorAll('.item').forEach(item => {
        const text = item.querySelector('.label').textContent;
        if (text.startsWith('View All')) return;
        const row = document.createElement('div');
        row.className = 'row-item';
        item.before(row);
        row.appendChild(item);
        const more = document.createElement('button');
        more.className = 'icon-btn item-more';
        more.setAttribute('aria-label', 'More actions for ' + text);
        more.setAttribute('aria-haspopup', 'menu');
        more.setAttribute('aria-expanded', 'false');
        more.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>';
        const menu = document.createElement('div');
        menu.className = 'action-menu';
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        const actions = [pinned ? 'Unpin' : 'Pin', 'Rename', 'Share', 'Delete'];
        menu.innerHTML = actions.map(action => '<button class="action-item' + (action === 'Delete' ? ' destructive' : '') + '" role="menuitem">' + action + '</button>').join('');
        row.append(more, menu);
        more.addEventListener('click', e => {
          e.stopPropagation();
          const open = menu.hidden;
          closeMenus();
          menu.hidden = !open;
          more.setAttribute('aria-expanded', String(open));
          row.classList.toggle('menu-open', open);
        });
      });
    });
  });

  // Pinned and Recents sections collapse and expand from their headings.
  document.querySelectorAll('.sb-scroll > .group').forEach(group => {
    const heading = group.querySelector(':scope > .group-label');
    if (!heading || !['Pinned', 'Recents'].includes(heading.textContent)) return;
    const body = document.createElement('div');
    body.className = 'group-items';
    while (heading.nextSibling) body.appendChild(heading.nextSibling);
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'group-toggle';
    toggleBtn.setAttribute('aria-expanded', 'true');
    toggleBtn.innerHTML = '<span>' + heading.textContent + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
    heading.replaceWith(toggleBtn);
    group.appendChild(body);
    toggleBtn.addEventListener('click', () => {
      const open = toggleBtn.getAttribute('aria-expanded') !== 'true';
      toggleBtn.setAttribute('aria-expanded', String(open));
      body.hidden = !open;
      toggleBtn.querySelector('svg').style.transform = open ? '' : 'rotate(-90deg)';
    });
  });

  // Navbar theme toggle: switches the whole page between light and dark.
  const themeToggle = document.getElementById('theme-toggle');
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
  themeToggle.addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark-theme');
    themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    themeToggle.innerHTML = dark ? SUN : MOON;
  });
</script>
</body>
</html>
